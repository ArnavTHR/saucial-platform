<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#028090">
    <title>SAUcial - Campus Feed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Reddit+Sans:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Mapped to Blue/Green Scheme while keeping original variable names for safety */
            --oxblood: #028090; /* Teal Blue */
            --oxblood-deep: #005c69; /* Deep Teal */
            --cream: #f0fbfa; /* Light Ice */
            --paper: #e8f6f3; /* Mint Tint */
            --surface: #ffffff; /* White */
            --ink: #052226; /* Dark Blue-Green */
            --muted: rgba(5, 34, 38, 0.6);
            --gold: #2ea979; /* Emerald Green */
            --line: rgba(5, 34, 38, 0.14);
            --display: "Reddit Sans", sans-serif;
            --body: "Reddit Sans", sans-serif;
            --mono: "Reddit Sans", monospace;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: var(--body);
            font-size: 14px;
            line-height: 1.5;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
        a { color: inherit; }

        /* ---------- Navbar ---------- */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            padding: 10px clamp(12px, 3vw, 28px);
            background: var(--oxblood);
            color: var(--cream);
            border-bottom: 2px solid var(--gold);
        }
        .nav-left, .nav-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-right: 14px;
            font-family: var(--display);
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            text-decoration: none;
            color: var(--cream);
        }
        .logo {
            display: inline-grid;
            place-items: center;
            width: 28px; height: 28px;
            border-radius: 6px;
            background: var(--gold);
            color: var(--surface);
            font-size: 1rem;
            font-weight: 700;
        }
        .nav-link {
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            color: rgba(240, 251, 250, 0.85);
            border-radius: 4px;
            transition: background .2s, color .2s;
        }
        .nav-link:hover { background: rgba(240, 251, 250, 0.12); color: #fff; }
        .nav-link.current { color: var(--gold); }
        #userInfo {
            max-width: 200px;
            margin-right: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--gold);
        }

        /* ---------- Layout ---------- */
        .container {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px clamp(12px, 3vw, 28px) 48px;
            align-items: start;
        }
        .main-col { min-width: 0; }
        .sidebar { display: flex; flex-direction: column; gap: 14px; }

        /* ---------- Listing tabs (segmented) ---------- */
        .tabs {
            display: inline-flex;
            flex-wrap: wrap;
            margin: 0 0 12px;
        }
        .tab-btn {
            margin: 0 -1px 0 0;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            color: var(--oxblood);
            background: var(--surface);
            border: 1px solid rgba(2, 128, 144, 0.45);
            border-radius: 0;
        }
        .tab-btn:first-child { border-radius: 4px 0 0 4px; }
        .tab-btn:last-child { border-radius: 0 4px 4px 0; margin-right: 0; }
        .tab-btn:hover { background: rgba(2, 128, 144, 0.08); color: var(--oxblood); }
        .tab-btn.active { background: var(--oxblood); color: var(--cream); border-color: var(--oxblood); }

        /* ---------- Posts (cards injected by feed.js) ---------- */
        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 10px 14px 8px;
            margin-bottom: 8px;
        }
        .main-feed .card {
            border-left: 3px solid transparent;
            transition: border-color .2s, box-shadow .2s;
        }
        .main-feed .card:hover {
            border-color: rgba(2, 128, 144, 0.3);
            border-left-color: var(--oxblood);
            box-shadow: 0 2px 10px -4px rgba(0, 92, 105, 0.25);
        }
        .card p { margin: 6px 0; line-height: 1.6; color: rgba(5, 34, 38, 0.85); }

        .post-header {
            margin-bottom: 4px;
            font-size: 12px;
            color: var(--muted);
        }
        .flair {
            display: inline-block;
            margin-left: 6px;
            padding: 0 8px;
            font-size: 11px;
            font-weight: 600;
            line-height: 18px;
            color: var(--oxblood);
            background: rgba(46, 169, 121, 0.2);
            border: 1px solid rgba(46, 169, 121, 0.8);
            border-radius: 10px;
            vertical-align: middle;
        }
        .post-title {
            margin: 0 0 4px;
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.3;
            color: var(--oxblood-deep);
        }
        .post-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 2px 4px;
            margin-top: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
        }
        .post-actions button {
            padding: 3px 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            background: transparent;
            border: none;
            border-radius: 4px;
        }
        .post-actions button:hover { background: rgba(2, 128, 144, 0.09); color: var(--oxblood); }

        /* threaded comments */
        .comment, .comment-card {
            margin-top: 8px;
            padding: 4px 0 4px 12px;
            border-left: 2px solid rgba(2, 128, 144, 0.25);
            font-size: 13px;
        }

        .main-feed:empty::before {
            content: "No posts yet. Be the first to post.";
            display: block;
            padding: 28px 14px;
            text-align: center;
            color: var(--muted);
            background: var(--surface);
            border: 1px dashed var(--line);
            border-radius: 4px;
        }

        /* ---------- Forms & buttons ---------- */
        .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
        input, select, textarea {
            width: 100%;
            padding: 8px 10px;
            font: inherit;
            color: var(--ink);
            background: #fdfefe;
            border: 1px solid var(--line);
            border-radius: 4px;
            transition: border-color .2s, box-shadow .2s;
        }
        textarea { resize: vertical; }
        input::placeholder, textarea::placeholder { color: rgba(5, 34, 38, 0.4); }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--oxblood);
            box-shadow: 0 0 0 3px rgba(2, 128, 144, 0.12);
        }
        select {
            appearance: none;
            padding-right: 30px;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23028090' stroke-width='1.5'/></svg>");
            background-repeat: no-repeat;
            background-position: right 10px center;
        }
        button {
            padding: 7px 14px;
            font-family: var(--body);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: var(--cream);
            background: var(--oxblood);
            border: 1px solid var(--oxblood);
            border-radius: 4px;
            transition: background .2s, color .2s, border-color .2s;
        }
        button:hover { background: var(--oxblood-deep); border-color: var(--oxblood-deep); }
        .logout-btn {
            color: var(--cream);
            background: transparent;
            border: 1px solid rgba(240, 251, 250, 0.45);
        }
        .logout-btn:hover { background: var(--cream); color: var(--oxblood); border-color: var(--cream); }

        /* ---------- Sidebar boxes ---------- */
        .box-title {
            margin: 0 0 8px;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .sidebar .card { padding: 14px; margin-bottom: 0; }
        .sidebar h3 {
            margin: 0 0 6px;
            font-family: var(--display);
            font-size: 1.15rem;
            font-weight: 600;
        }
        .sidebar p { margin: 0 0 8px; color: rgba(5, 34, 38, 0.75); }

        details.compose { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
        details.compose summary {
            list-style: none;
            cursor: pointer;
            padding: 10px 14px;
            font-weight: 600;
            text-align: center;
            color: var(--cream);
            background: var(--oxblood);
            transition: background .2s;
        }
        details.compose summary::-webkit-details-marker { display: none; }
        details.compose summary:hover { background: var(--oxblood-deep); }
        details.compose .compose-body { padding: 14px; }

        .community-list { list-style: none; margin: 0; padding: 0; }
        .community-list button {
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--ink);
            text-align: left;
            background: transparent;
            border: none;
            border-radius: 4px;
        }
        .community-list button::after { content: "›"; color: var(--gold); font-size: 16px; }
        .community-list button:hover,
        .community-list button.active { background: rgba(2, 128, 144, 0.09); color: var(--oxblood); }

        footer {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px clamp(12px, 3vw, 28px) 32px;
            font-size: 12px;
            color: var(--muted);
            border-top: 1px solid var(--line);
        }

        @media (max-width: 860px) {
            .container { grid-template-columns: 1fr; }
            .brand { margin-right: 4px; }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <a class="brand" href="/index.html"><span class="logo">S</span>SAUcial</a>
        <a class="nav-link current" href="/index.html">Feed</a>
        <a class="nav-link" href="/profile.html">My Profile</a>
    </div>
    <div class="nav-right">
        <span id="userInfo"></span>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">
    <div class="main-col">
        <div class="tabs" id="categoryTabs">
            <button class="tab-btn active" onclick="filterCategory('All')">All</button>
            <button class="tab-btn" onclick="filterCategory('General')">General</button>
            <button class="tab-btn" onclick="filterCategory('Academics')">Academics</button>
            <button class="tab-btn" onclick="filterCategory('Events')">Events</button>
        </div>

        <div class="main-feed" id="feedContainer">
            <!-- Posts will be injected here by JavaScript -->
        </div>
    </div>

    <aside class="sidebar">
        <details class="compose" id="composeBox" open>
            <summary>Create a Post</summary>
            <div class="compose-body">
                <form id="createPostForm">
                    <div class="form-group">
                        <input type="text" id="postTitle" placeholder="Title" aria-label="Post title" required>
                    </div>
                    <div class="form-group">
                        <textarea id="postContent" rows="5" placeholder="What are your thoughts?" aria-label="Post content" required></textarea>
                    </div>
                    <div class="form-group">
                        <select id="postCategory" aria-label="Category">
                            <option value="General">General</option>
                            <option value="Academics">Academics</option>
                            <option value="Events">Events</option>
                        </select>
                    </div>
                    <button type="submit" style="width: 100%;">Post</button>
                </form>
            </div>
        </details>

        <div class="card">
            <p class="box-title">About</p>
            <h3>SAUcial</h3>
            <p>The campus conversation for students, staff and faculty. Post under your real name or anonymously.</p>
        </div>

        <div class="card">
            <p class="box-title">Communities</p>
            <ul class="community-list">
                <li><button onclick="filterCategory('General')">c/General</button></li>
                <li><button onclick="filterCategory('Academics')">c/Academics</button></li>
                <li><button onclick="filterCategory('Events')">c/Events</button></li>
            </ul>
        </div>
    </aside>
</div>

<footer>SAUcial · Speak freely</footer>

<script>
    // collapse the compose box on small screens (does not touch form IDs)
    if (window.innerWidth < 860) document.getElementById('composeBox').open = false;
</script>
<script src="/public/js/feed.js"></script>
</body>
</html>
